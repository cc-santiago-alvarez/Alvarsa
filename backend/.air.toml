root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Compila el binario del servidor (composition root en cmd/server).
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  full_bin = ""
  # Recompila al cambiar código o config.
  include_ext = ["go", "env"]
  exclude_dir = ["tmp", "testdata", "bin"]
  exclude_regex = ["_test\\.go"]
  include_dir = []
  include_file = [".env"]
  exclude_file = []
  exclude_unchanged = false
  follow_symlink = false
  log = "build-errors.log"
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = 2000
  rerun = false
  rerun_delay = 500
  args_bin = []

[log]
  time = true
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
